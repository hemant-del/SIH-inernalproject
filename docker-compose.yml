version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: creditgps_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creditgps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditgps_pass}
      POSTGRES_DB: ${POSTGRES_DB:-creditgps_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creditgps}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
